<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="112" fill="#08080C"/>
  <defs>
    <linearGradient id="sf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E63"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>
    <linearGradient id="sf-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2E63" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Neon Halo -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#sf-glow)" stroke-width="4"/>
  
  <!-- Abstract SF Play Chevron -->
  <g transform="translate(256, 256) scale(1.1) translate(-256, -256)">
    <!-- Main Play Symbol Base -->
    <path d="M170 120 L380 256 L170 392 Z" fill="url(#sf-grad)" opacity="0.15"/>
    
    <!-- Outer 'S' Blade Contour -->
    <path d="M170 130 C240 110, 340 180, 260 256 C180 330, 280 400, 360 380" 
          fill="none" stroke="url(#sf-grad)" stroke-width="28" stroke-linecap="round"/>
          
    <!-- Inner Forward Play Triangle -->
    <path d="M220 180 L330 256 L220 332 Z" fill="url(#sf-grad)"/>
  </g>
</svg>
