[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
    Content-Security-Policy = "default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; script-src * 'self' 'unsafe-inline' 'unsafe-eval' blob:; frame-src * 'self' blob: data: https:; media-src * 'self' blob: data: https:; img-src * 'self' data: blob: https:; connect-src * 'self' https: wss: blob: data:; worker-src 'self' blob:; style-src * 'self' 'unsafe-inline';"
